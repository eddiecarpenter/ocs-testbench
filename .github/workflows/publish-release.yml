# publish-release.yml — Cross-platform release builder for OCS Testbench.
#
# Release chain:
#   git tag v1.2.3 && git push origin v1.2.3
#     ↓
#   This workflow — builds all platform artefacts, creates the GitHub release.
#     ↓
#   on: release: types: [published]   (release.yml, framework-managed)
#     ↓
#   Framework generates AI release notes and updates the release body.
#
# Artefacts produced:
#   ocs-testbench-darwin-arm64.zip  — macOS .app bundle (Apple Silicon)
#   ocs-testbench-darwin-amd64.zip  — macOS .app bundle (Intel)
#   ocs-testbench-windows-amd64.zip — Windows .exe (Wails / WebView2)
#   ocs-testbench-linux-amd64.tar.gz — headless server binary (no WebKitGTK)
#
# macOS note: bundles are ad-hoc signed by Wails. On first launch Gatekeeper
# may prompt; right-click → Open to bypass. Notarisation can be added later.

name: Publish Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  # ── Per-platform builds ────────────────────────────────────────────────────
  build:
    name: Build — ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name:     macOS arm64
            os:       macos-latest      # Apple Silicon runner
            artifact: ocs-testbench-darwin-arm64.zip
            wails:    true

          - name:     macOS amd64
            os:       macos-13          # last Intel runner
            artifact: ocs-testbench-darwin-amd64.zip
            wails:    true

          - name:     Windows amd64
            os:       windows-latest
            artifact: ocs-testbench-windows-amd64.zip
            wails:    true

          - name:     Linux amd64
            os:       ubuntu-latest
            artifact: ocs-testbench-linux-amd64.tar.gz
            wails:    false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # .ai/ is the agentic framework submodule — not needed for builds.
          submodules: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # ── Wails desktop builds (macOS + Windows) ──────────────────────────────

      - name: Install Wails CLI
        if: matrix.wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build desktop bundle
        if: matrix.wails
        shell: bash
        working-directory: cmd/ocs-testbench
        run: |
          wails build -clean -skipbindings \
            -ldflags "-X main.Version=${{ github.ref_name }}"

      # Ship a default config.yaml inside the .app so it opens from Finder
      # without needing CONFIG_FILE set (resolveConfigPath looks next to binary).
      - name: Bundle config.yaml into .app (macOS)
        if: runner.os == 'macOS'
        run: |
          cp cmd/ocs-testbench/config.yaml \
            "cmd/ocs-testbench/build/bin/ocs-testbench.app/Contents/MacOS/config.yaml"

      # ── Linux headless server binary ────────────────────────────────────────

      - name: Build server binary (Linux)
        if: runner.os == 'Linux'
        run: |
          go build \
            -ldflags "-X main.Version=${{ github.ref_name }}" \
            -o ocs-testbench \
            ./cmd/ocs-testbench/

      # ── Package artefacts ───────────────────────────────────────────────────

      - name: Package — macOS (.app → zip)
        if: runner.os == 'macOS'
        run: |
          cd cmd/ocs-testbench/build/bin
          zip -r "${{ github.workspace }}/${{ matrix.artifact }}" ocs-testbench.app

      - name: Package — Windows (.exe → zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "cmd\ocs-testbench\build\bin\OCS Testbench.exe" `
            -DestinationPath "${{ matrix.artifact }}"

      - name: Package — Linux (binary → tar.gz)
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.artifact }}" ocs-testbench

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # ── Create GitHub release ──────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artefacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release and upload artefacts
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "Release ${{ github.ref_name }}" \
            --notes "Generating release notes…" \
            ocs-testbench-darwin-arm64.zip \
            ocs-testbench-darwin-amd64.zip \
            ocs-testbench-windows-amd64.zip \
            ocs-testbench-linux-amd64.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
