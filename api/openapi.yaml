openapi: 3.1.0
info:
  title: OCS Testbench API
  version: 0.2.0
  description: |
    REST API for the OCS Testbench UI and external clients.

    This specification is the single source of truth for the HTTP contract
    between the Go backend (`internal/api`) and the React frontend (`web/`).
    Generated TypeScript types live at `web/src/api/schema.d.ts` — regenerate
    after any change to this file.

    See `docs/ARCHITECTURE.md` for behavioural semantics (state machines,
    invariants, variable resolution rules). This document is the wire
    contract; it does not restate the semantics.

    Real-time server → client events (peer status changes, execution
    progress, pause / resume transitions) are delivered via the SSE
    endpoint at `GET /events`.

servers:
  - url: /api/v1
    description: Current server (relative to origin)

tags:
  - name: Dashboard
    description: Aggregated dashboard views
  - name: Peers
    description: Diameter peer configuration and live status
  - name: Subscribers
    description: Subscriber identities used in test scenarios
  - name: Scenarios
    description: Scenario definitions (CCR envelope, services, variables, steps)
  - name: Executions
    description: Scenario executions — start, control, inspect
  - name: Metrics
    description: Time-series telemetry
  - name: Events
    description: Server-Sent Events stream for live updates
  - name: Docs
    description: Self-describing API — the spec and browsable docs
  - name: AI
    description: AI assistant configuration and model discovery

paths:
  # ─────────────── Self-describing API ───────────────

  /openapi.yaml:
    get:
      tags: [Docs]
      operationId: getOpenApiYaml
      summary: This OpenAPI spec, served as YAML
      responses:
        '200':
          description: OpenAPI 3.1 document (YAML)
          content:
            application/yaml:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Problem'

  /openapi.json:
    get:
      tags: [Docs]
      operationId: getOpenApiJson
      summary: This OpenAPI spec, served as JSON
      responses:
        '200':
          description: OpenAPI 3.1 document (JSON)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/Problem'

  /docs:
    get:
      tags: [Docs]
      operationId: getApiDocs
      summary: Browsable API reference (Redoc / Swagger UI)
      responses:
        '200':
          description: HTML documentation page
          content:
            text/html:
              schema:
                type: string

  # ─────────────── Dashboard ───────────────

  /dashboard/kpis:
    get:
      tags: [Dashboard]
      operationId: getDashboardKpis
      summary: Aggregated KPI counters for the dashboard
      responses:
        '200':
          description: Current KPI snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardKpis'
        default:
          $ref: '#/components/responses/Problem'

  # ─────────────── Peers ───────────────

  /peers:
    get:
      tags: [Peers]
      operationId: listPeers
      summary: List configured peers with current connection status
      responses:
        '200':
          description: Peer list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Peer'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Peers]
      operationId: createPeer
      summary: Create a new peer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeerInput'
      responses:
        '201':
          description: Peer created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Peer'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        default:
          $ref: '#/components/responses/Problem'

  /peers/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Peers]
      operationId: getPeer
      summary: Get a single peer by id
      responses:
        '200':
          description: Peer detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Peer'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
    put:
      tags: [Peers]
      operationId: updatePeer
      summary: Replace a peer's configuration
      description: |
        Full replacement of the mutable fields. Live-state fields (`status`,
        `statusDetail`, `lastChangeAt`) are ignored on write and always
        reflect the server's current view in the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeerInput'
      responses:
        '200':
          description: Peer updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Peer'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Peers]
      operationId: deletePeer
      summary: Delete a peer
      responses:
        '204':
          description: Peer deleted
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /peers/{id}/start:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Peers]
      operationId: startPeer
      summary: Start this peer (enable supervision + connect)
      responses:
        '200':
          description: Peer started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Peer'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /peers/{id}/stop:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Peers]
      operationId: stopPeer
      summary: Stop this peer (disable supervision + disconnect)
      responses:
        '200':
          description: Peer stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Peer'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /peers/test:
    post:
      tags: [Peers]
      operationId: testPeerConfig
      summary: Dry-run a CER/CEA probe against a candidate peer config
      description: |
        Stateless synchronous capability exchange against the `PeerInput` in
        the body. Neither reads nor writes persistent state — valid for
        brand-new peers that have no id yet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeerInput'
      responses:
        '200':
          description: Probe completed (inspect `ok` for outcome)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeerTestResult'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        default:
          $ref: '#/components/responses/Problem'

  # ─────────────── Subscribers ───────────────

  /subscribers:
    get:
      tags: [Subscribers]
      operationId: listSubscribers
      summary: List subscribers
      description: |
        Returns every configured subscriber unpaginated — the testbench is
        expected to hold at most a few thousand subscribers and the UI does
        client-side search/filter.
      responses:
        '200':
          description: Subscriber list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subscriber'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Subscribers]
      operationId: createSubscriber
      summary: Create a new subscriber
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriberInput'
      responses:
        '201':
          description: Subscriber created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscriber'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        default:
          $ref: '#/components/responses/Problem'

  /subscribers/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Subscribers]
      operationId: getSubscriber
      summary: Get a single subscriber by id
      responses:
        '200':
          description: Subscriber detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscriber'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
    put:
      tags: [Subscribers]
      operationId: updateSubscriber
      summary: Replace a subscriber's configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriberInput'
      responses:
        '200':
          description: Subscriber updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscriber'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Subscribers]
      operationId: deleteSubscriber
      summary: Delete a subscriber
      responses:
        '204':
          description: Subscriber deleted
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /tac-catalog:
    get:
      tags: [Subscribers]
      operationId: listTacCatalog
      summary: Curated TAC (Type Allocation Code) catalogue
      description: |
        Immutable server-side catalogue of manufacturer/model combinations
        with their 8-digit TAC prefix. Used to populate Manufacturer → Model
        cascading selects and derive IMEI generation. Cache aggressively.
      responses:
        '200':
          description: TAC catalogue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TacEntry'
        default:
          $ref: '#/components/responses/Problem'

  # ─────────────── Scenarios ───────────────

  /scenarios:
    get:
      tags: [Scenarios]
      operationId: listScenarios
      summary: List scenarios (system starters + user scenarios)
      description: |
        Returns both system starters (`origin: "system"`, immutable) and
        user scenarios (`origin: "user"`). Client-side filtering expected;
        no server-side pagination.
      parameters:
        - name: origin
          in: query
          description: Filter by origin
          required: false
          schema:
            $ref: '#/components/schemas/ScenarioOrigin'
        - name: serviceType
          in: query
          description: Filter by service type
          required: false
          schema:
            $ref: '#/components/schemas/ServiceType'
        - name: peerId
          in: query
          description: Filter by bound peer
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Scenario list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScenarioSummary'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Scenarios]
      operationId: createScenario
      summary: Create a new scenario from scratch
      description: |
        Creates a user scenario. Most users will reach for
        `POST /scenarios/{id}/duplicate` instead to start from a system
        starter; this endpoint is for advanced flows that bring their own
        full scenario body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioInput'
      responses:
        '201':
          description: Scenario created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        default:
          $ref: '#/components/responses/Problem'

  /scenarios/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Scenarios]
      operationId: getScenario
      summary: Get a single scenario by id
      responses:
        '200':
          description: Scenario detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
    put:
      tags: [Scenarios]
      operationId: updateScenario
      summary: Replace a scenario
      description: |
        Full replacement. System starters (`origin: "system"`) are
        immutable and return `409 Conflict` on write — duplicate first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioInput'
      responses:
        '200':
          description: Scenario updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Scenario is a system starter and cannot be modified
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags: [Scenarios]
      operationId: deleteScenario
      summary: Delete a scenario
      description: |
        User scenarios only. System starters cannot be deleted (returns
        `409 Conflict`).
      responses:
        '204':
          description: Scenario deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Scenario is a system starter and cannot be deleted
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /scenarios/{id}/duplicate:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Scenarios]
      operationId: duplicateScenario
      summary: Duplicate a scenario into a new user scenario
      description: |
        Creates a new scenario with `origin: "user"` carrying a deep copy
        of the source's AVP tree, services, variables, and steps. There is
        no lineage tracking — the duplicate is fully independent.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioDuplicateInput'
      responses:
        '201':
          description: Scenario duplicated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        default:
          $ref: '#/components/responses/Problem'

  # ─────────────── Executions ───────────────

  /executions:
    get:
      tags: [Executions]
      operationId: listExecutions
      summary: List past and in-progress executions
      parameters:
        - name: state
          in: query
          description: Filter by execution state
          required: false
          schema:
            $ref: '#/components/schemas/ExecutionState'
        - name: scenarioId
          in: query
          required: false
          schema:
            type: string
        - name: batchId
          in: query
          description: Group executions started together by a batched Run
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/OffsetQuery'
      responses:
        '200':
          description: Execution list (newest first)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      tags: [Executions]
      operationId: startExecution
      summary: Start a scenario — single run or batched
      description: |
        Creates one or more executions of a scenario. With defaults
        (`concurrency: 1`, `repeats: 1`) a single execution is returned in
        `items`. With higher values the engine spawns `concurrency`
        parallel workers, each running the scenario `repeats` times; all
        executions share a common `batchId` and are returned in `items`.

        `mode` controls runtime behaviour:
        - `interactive` — honours `pause` steps and runtime breakpoints.
          Typical when a user starts from the Scenario Builder.
        - `continuous` — ignores pauses and breakpoints; runs straight
          through. Required for batched runs.

        Optional `overrides` apply to every spawned execution:
        - `subscriberIds` — pool, round-robin across iterations
        - `peerId` — overrides the scenario's default peer binding for
          this run only

        `concurrency` and `repeats` only apply to `continuous` mode and
        are ignored (rejected with 422) for `interactive` runs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartExecutionInput'
      responses:
        '202':
          description: Execution started; returns the session identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartExecutionSimpleResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        default:
          $ref: '#/components/responses/Problem'

  /executions/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Executions]
      operationId: getExecution
      summary: Get a single execution with its full step-by-step detail
      description: |
        Returns the current status of an execution session, including
        lifecycle state, current step index, and aggregated timing
        metrics. For running executions this is a point-in-time snapshot;
        real-time updates are delivered via the SSE
        `GET /events/executions/{id}` endpoint.
      responses:
        '200':
          description: Execution status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionStatusResult'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /executions/{id}/pause:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Executions]
      operationId: pauseExecution
      summary: Request a pause at the next safe point
      description: |
        Requests the engine to pause the execution at the next safe point
        (between steps). Returns the current execution; the transition to
        `paused` is delivered via the SSE `execution.paused` event when
        it actually happens. For continuous-mode executions prefer
        `/interrupt`, which pauses after the current iteration completes.
      responses:
        '200':
          description: Pause requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IllegalStateProblem'
        default:
          $ref: '#/components/responses/Problem'

  /executions/{id}/resume:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Executions]
      operationId: resumeExecution
      summary: Resume a paused execution
      description: |
        Continues normal execution from the paused step. Only valid when
        the execution is in `paused` state; returns `409` otherwise.
      responses:
        '200':
          description: Execution resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IllegalStateProblem'
        default:
          $ref: '#/components/responses/Problem'

  /executions/{id}/step:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Executions]
      operationId: stepExecution
      summary: Advance exactly one step, then pause again
      description: |
        Only valid from `paused` state. Executes exactly one scenario step
        and returns to `paused`. Returns the step result including result
        code and assertion outcomes.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepExecutionInput'
      responses:
        '200':
          description: Step executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepExecutionResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IllegalStateProblem'
        default:
          $ref: '#/components/responses/Problem'

  /executions/{id}/stop:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Executions]
      operationId: stopExecution
      summary: Stop a running execution after the current step
      description: |
        Requests the engine to stop the execution cleanly. The execution
        finishes its current step and then transitions to `completed` or
        `terminated`. Returns immediately — the actual stop happens
        asynchronously. This is the clean-stop variant; use `/abort`
        for immediate forceful termination.
      responses:
        '200':
          description: Stop accepted
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'

  /executions/{id}/abort:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Executions]
      operationId: abortExecution
      summary: Abort a running or paused execution
      description: |
        Terminates the execution immediately, transitioning it to
        `aborted`. Sends a best-effort CCR-TERMINATE if the scenario is
        in `sessionMode: session` and has an active session.
      responses:
        '200':
          description: Execution aborted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IllegalStateProblem'
        default:
          $ref: '#/components/responses/Problem'

  /executions/{id}/interrupt:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Executions]
      operationId: interruptExecution
      summary: Interrupt a continuous execution after the current send
      description: |
        Signals the engine to pause after the current iteration completes.
        Only valid for continuous-mode executions in `active` state.
        The execution transitions to `paused`; use `/run-to-end` to resume.
      responses:
        '200':
          description: Interrupt accepted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IllegalStateProblem'
        default:
          $ref: '#/components/responses/Problem'

  /executions/{id}/run-to-end:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Executions]
      operationId: runToEnd
      summary: Resume an interrupted execution to completion
      description: |
        Resumes a continuous execution that was interrupted via `/interrupt`,
        running the remaining steps to completion. Also triggers the next
        step for interactive-mode executions in `paused` state.
      responses:
        '200':
          description: Resumed
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IllegalStateProblem'
        default:
          $ref: '#/components/responses/Problem'

  /executions/{id}/context:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Executions]
      operationId: applyContextOverride
      summary: Context override — permanent mutation of live variables
      description: |
        Writes the given variable values into the execution's live context
        map. Affects this send and every subsequent send. Only valid from
        `paused` state. The server applies the override compatibility
        matrix (see `docs/ARCHITECTURE.md §5`) and rejects updates to
        engine-reserved system variables with `422`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextOverrideInput'
      responses:
        '200':
          description: Overrides applied; returns the updated execution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IllegalStateProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        default:
          $ref: '#/components/responses/Problem'

  /executions/{id}/payload:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    post:
      tags: [Executions]
      operationId: applyPayloadOverride
      summary: Payload override — one-shot values for the next send
      description: |
        Writes the given variable values into a one-shot payload override
        map. These values shadow the live context for the **next send
        only** and are then discarded. Only valid from `paused` state.
        Repeated calls overwrite the pending payload override.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayloadOverrideInput'
      responses:
        '200':
          description: Payload override applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Execution'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IllegalStateProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        default:
          $ref: '#/components/responses/Problem'

  /executions/{id}/breakpoints:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Executions]
      operationId: listBreakpoints
      summary: List runtime breakpoints on this execution
      responses:
        '200':
          description: Breakpoint indices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakpointSet'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
    put:
      tags: [Executions]
      operationId: setBreakpoints
      summary: Replace the set of runtime breakpoints
      description: |
        Breakpoints are stored on the execution, not the scenario, so they
        don't pollute the scenario definition. The engine honours them at
        the start of each step when the execution is in `interactive`
        mode.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BreakpointSet'
      responses:
        '200':
          description: Breakpoints updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakpointSet'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationProblem'
        default:
          $ref: '#/components/responses/Problem'

  # ─────────────── Events (SSE) ───────────────

  /events:
    get:
      tags: [Events]
      operationId: subscribeEvents
      summary: Server-Sent Events stream of live updates
      description: |
        Opens a long-lived SSE stream of server → client events.

        ### Contract

        Every event carries the **full current state** of the resource it
        concerns. Clients can treat each event as a last-write-wins
        replacement — missed events do not need to be replayed because
        the next event for the same resource supersedes them. Reconnection
        is automatic; on reconnect clients should invalidate their caches
        so the next paint reads truth from REST.

        ### Event types

        | `event:` field | Payload schema | Notes |
        |---|---|---|
        | `peer.updated` | `Peer` | Any status transition, config change. |
        | `dashboard.kpi` | `DashboardKpis` | Aggregate counters changed. |
        | `execution.created` | `ExecutionSummary` | A new execution has started. |
        | `execution.progress` | `Execution` | A running execution advanced. Includes all completed steps so far. |
        | `execution.paused` | `ExecutionPaused` | Execution entered `paused` state (pause step, breakpoint, or user). |
        | `execution.resumed` | `ExecutionResumed` | Execution left `paused` state. |
        | `execution.completed` | `Execution` | Execution reached a terminal state (`success` / `failure` / `aborted` / `error`). |

        OpenAPI does not model SSE richly; this operation documents the
        connection point only.
      responses:
        '200':
          description: Event stream opened
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE stream. Each record is `event: <type>\ndata: <json>\n\n`.
                  See `application/json` below for the JSON shapes carried
                  in `data:`.
            application/json:
              schema:
                $ref: '#/components/schemas/SseEventPayload'

  # ─────────────── Expressions ───────────────

  /expressions/evaluate:
    post:
      tags: [Expressions]
      operationId: evaluateExpression
      summary: Evaluate a ruleevaluator expression
      description: |
        Evaluates a ruleevaluator expression against a supplied variable map
        and returns the result. Both `{{VAR}}` and bare `VAR` notation are
        accepted — the engine normalises them before evaluation. Useful for
        validating `repeatUntil`, `assertions`, and `guards` expressions
        before saving a scenario.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expression]
              properties:
                expression:
                  type: string
                  description: Expression to evaluate (supports `{{VAR}}` and bare `VAR`).
                vars:
                  type: object
                  description: Variable map to evaluate the expression against.
                  additionalProperties: true
      responses:
        '200':
          description: Evaluation result (always 200; parse errors are in the `error` field)
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    description: The evaluated result (boolean, number, or string).
                  error:
                    type: string
                    description: Present when evaluation failed; absent on success.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        default:
          $ref: '#/components/responses/Problem'

  # ─────────────── Metrics ───────────────

  /metrics/response-time:
    get:
      tags: [Metrics]
      operationId: getResponseTimeSeries
      summary: p50 / p95 / p99 response-time series
      parameters:
        - name: window
          in: query
          description: Time window to return (ISO 8601 duration)
          required: false
          schema:
            type: string
            default: PT1H
            examples: [PT15M, PT1H, PT24H]
      responses:
        '200':
          description: Response-time series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseTimeSeries'
        default:
          $ref: '#/components/responses/Problem'

  # ─────────────── AI Settings Configuration ───────────────

  /config/ai:
    get:
      tags: [AI]
      operationId: getAIConfig
      summary: Get current AI assistant configuration
      description: |
        Returns the configured LLM endpoint, model, and a boolean indicating
        whether an API key is set. The API key value is never returned.
        When the AI assistant was not configured at startup, returns a
        zero-value response (empty endpoint/model, apiKeySet false).
      responses:
        '200':
          description: Current AI configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIConfig'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags: [AI]
      operationId: updateAIConfig
      summary: Update AI assistant configuration and hot-reload the LLM client
      description: |
        Replaces the LLM endpoint, model, and optionally the API key.
        Leave `apiKey` blank to preserve the existing key. The LLM client
        is hot-swapped under a mutex — in-flight requests continue with the
        old client; subsequent requests use the new one.

        Returns 503 when the binary was started without any LLM endpoint
        configured — a restart with a valid endpoint is required in that case.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIConfigInput'
      responses:
        '200':
          description: Updated AI configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIConfig'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '503':
          description: AI assistant not configured at startup — restart required
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

  /config/ai/models:
    get:
      tags: [AI]
      operationId: listAIModels
      summary: List available models from the configured LLM endpoint
      description: |
        Proxies `GET {endpoint}/v1/models` (OpenAI-compatible) server-side
        with a 5-second timeout. Returns the list of model IDs. This avoids
        CORS issues in the browser and works for any OpenAI-compatible endpoint
        (LM Studio, Ollama, OpenAI, etc.).

        Returns 503 when the AI assistant is not configured.
        Returns 502 when the upstream endpoint is unreachable or returns an error.
      responses:
        '200':
          description: List of model IDs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                examples:
                  - [gpt-4o, gpt-4o-mini, gpt-3.5-turbo]
        '502':
          description: Upstream model endpoint returned an error or was unreachable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: AI assistant not configured
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'

components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: Resource identifier
      schema:
        type: string
    LimitQuery:
      name: limit
      in: query
      description: Maximum number of items to return
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    OffsetQuery:
      name: offset
      in: query
      description: Number of items to skip
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    Problem:
      description: Error response (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationProblem:
      description: |
        Validation error (RFC 7807). Carries field-level error messages
        keyed by JSON Pointer references into the request body.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    IllegalStateProblem:
      description: |
        The requested operation is not legal from the execution's current
        state. For example: resuming an execution that is not `paused`,
        or aborting one that has already reached a terminal state.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    # ─────────────── Errors ───────────────

    Problem:
      type: object
      description: RFC 7807 problem details
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri
        errors:
          type: object
          description: |
            Optional field-level validation errors. Keys are JSON Pointer
            references into the request body (e.g. `/name`, `/services/0/ratingGroup`);
            values are arrays of human-readable error messages. Present on
            `422` responses and ignorable otherwise.
          additionalProperties:
            type: array
            items:
              type: string
            minItems: 1

    # ─────────────── Pagination ───────────────

    PageMeta:
      type: object
      required: [total, limit, offset]
      properties:
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0

    # ─────────────── Dashboard ───────────────

    DashboardKpis:
      type: object
      required: [peers, subscribers, scenarios, activeRuns]
      properties:
        peers:
          type: object
          required: [connected, total]
          properties:
            connected:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 0
        subscribers:
          type: integer
          minimum: 0
        scenarios:
          type: integer
          minimum: 0
        activeRuns:
          type: integer
          minimum: 0
          description: Executions currently in `running` or `paused` state

    # ─────────────── Peers ───────────────

    PeerStatus:
      type: string
      description: |
        Current runtime state of a peer.

        - `stopped`       — Administratively down; no reconnect attempts.
        - `disconnected`  — Supervision on, transport down; auto-redials.
        - `connecting`    — CER/CEA exchange in progress.
        - `connected`     — Session established.
        - `disconnecting` — Graceful teardown in progress.
        - `restarting`    — Admin-initiated stop+start for a config change.
        - `error`         — Supervision on, persistent failure, exp. backoff.

        `stopped` vs `disconnected`: admin intent vs transport health.
      enum:
        - stopped
        - disconnected
        - connecting
        - connected
        - disconnecting
        - restarting
        - error

    PeerTransport:
      type: string
      description: Transport protocol used for the Diameter connection.
      enum: [TCP, TLS]

    Peer:
      type: object
      required:
        [id, name, host, port, originHost, originRealm, transport, watchdogIntervalSeconds, autoConnect, status]
      properties:
        id:
          type: string
        name:
          type: string
        host:
          type: string
          examples: ['10.0.1.5']
        port:
          type: integer
          minimum: 1
          maximum: 65535
          examples: [3868]
        originHost:
          type: string
          examples: ['ctf-01.test.local']
        originRealm:
          type: string
          examples: ['test.local']
        destHost:
          type: string
          description: |
            Destination-Host AVP sent in every CCR. When omitted the AVP
            is not sent and the OCS routes by Destination-Realm alone.
          examples: ['ocs.carrier.com']
        destRealm:
          type: string
          description: |
            Destination-Realm AVP sent in every CCR. Defaults to
            `originRealm` when omitted.
          examples: ['carrier.com']
        transport:
          $ref: '#/components/schemas/PeerTransport'
        watchdogIntervalSeconds:
          type: integer
          minimum: 5
          maximum: 3600
          default: 30
        autoConnect:
          type: boolean
          description: |
            Pure server-boot flag. When the server starts, peers with
            `autoConnect: true` are started automatically; peers with
            `autoConnect: false` remain `stopped` until operator action.
          default: true
        status:
          $ref: '#/components/schemas/PeerStatus'
        statusDetail:
          type: string
          description: Optional human-readable status detail
        lastChangeAt:
          type: string
          format: date-time

    PeerInput:
      type: object
      description: |
        Writable subset of `Peer`. Used for both create and replace.
        Live-state fields are computed server-side and rejected on write.
      required: [name, host, port, originHost, originRealm, transport, watchdogIntervalSeconds, autoConnect]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        host:
          type: string
          minLength: 1
        port:
          type: integer
          minimum: 1
          maximum: 65535
        originHost:
          type: string
          minLength: 1
        originRealm:
          type: string
          minLength: 1
        destHost:
          type: string
          description: |
            Destination-Host AVP sent in every CCR. Omit to route by
            realm only.
        destRealm:
          type: string
          description: |
            Destination-Realm AVP. Defaults to `originRealm` when omitted.
        transport:
          $ref: '#/components/schemas/PeerTransport'
        watchdogIntervalSeconds:
          type: integer
          minimum: 5
          maximum: 3600
          default: 30
        autoConnect:
          type: boolean
          default: true

    PeerTestResult:
      type: object
      required: [ok, durationMs]
      properties:
        ok:
          type: boolean
        durationMs:
          type: integer
          minimum: 0
        detail:
          type: string

    # ─────────────── Subscribers ───────────────

    Subscriber:
      type: object
      required: [id, msisdn, iccid]
      properties:
        id:
          type: string
        msisdn:
          type: string
          description: E.164 MSISDN, digits only; primary identifier.
          pattern: '^[0-9]{8,15}$'
          examples: ['27821234567']
        iccid:
          type: string
          description: SIM serial, 19 or 20 digits. Unique across subscribers.
          pattern: '^[0-9]{19,20}$'
          examples: ['89270100001234567890']
        tac:
          type: string
          description: 8-digit Type Allocation Code, from `GET /tac-catalog`.
          pattern: '^[0-9]{8}$'
        imei:
          type: string
          description: 15-digit IMEI; present only when a device is bound.
          pattern: '^[0-9]{15}$'

    SubscriberInput:
      type: object
      required: [msisdn, iccid]
      properties:
        msisdn:
          type: string
          pattern: '^[0-9]{8,15}$'
        iccid:
          type: string
          pattern: '^[0-9]{19,20}$'
        tac:
          type: string
          pattern: '^[0-9]{8}$'
        imei:
          type: string
          pattern: '^[0-9]{15}$'

    TacEntry:
      type: object
      required: [tac, manufacturer, model]
      properties:
        tac:
          type: string
          pattern: '^[0-9]{8}$'
        manufacturer:
          type: string
          examples: ['Apple']
        model:
          type: string
          examples: ['iPhone 14 Pro']
        year:
          type: integer
          minimum: 2000
          maximum: 2099

    # ─────────────── Scenarios ───────────────
    #
    # Scenarios are the primary authoring surface. See docs/ARCHITECTURE.md
    # §3 and §4 for the full semantics. Key invariants this schema encodes:
    # - `avpTree` is the CCR envelope *minus* the service-unit AVPs.
    # - The engine places RSU/USU per `serviceModel` at send time.
    # - Every leaf value is a variable reference; literals are variables
    #   with `source: generator, strategy: literal`.
    # - MSI (455) is engine-managed and derived from `serviceModel`.

    UnitType:
      type: string
      description: |
        Service unit type. Derived from `serviceType` by the engine —
        not set directly by the user.
      enum: [VOLUME, TIME, EVENT]

    SessionMode:
      type: string
      description: |
        Session-based vs event-based charging model.
        - `session` — INITIAL → UPDATE(s) → TERMINATE lifecycle.
        - `event`   — one-shot CCR-EVENT, no lifecycle.
      enum: [session, event]

    ServiceModel:
      type: string
      description: |
        Where service-unit AVPs live in the CCR.
        - `root`        — RSU/USU under the CCR root; no MSCC; MSI omitted.
        - `single-mscc` — exactly one MSCC block; MSI = 0.
        - `multi-mscc`  — one-to-many MSCC blocks; MSI = 1; OCTET only.
        See compatibility matrix in docs/ARCHITECTURE.md §4.
      enum: [root, single-mscc, multi-mscc]

    ScenarioOrigin:
      type: string
      description: |
        - `system` — ships with the product; immutable; can only be duplicated.
        - `user`   — created/owned by the user.
      enum: [system, user]

    ServiceType:
      type: string
      description: |
        Semantic service classification. Drives unit type, default session
        mode, and the Service-Information child AVP injected by the engine.
        Combined with `serviceProfile` for the AVP code mapping.

        | Value         | Unit type | Session mode | Service-Info child              |
        |---------------|-----------|--------------|----------------------------------|
        | VOICE         | TIME      | session      | IMS-Information / IN_INFORMATION |
        | DATA          | VOLUME    | session      | PS-Information (both profiles)   |
        | SMS           | EVENT     | session      | SMS-Information / SMS_INFORMATION|
        | USSD1_EVENT   | EVENT     | event        | USSD-Information / DCD_INFORMATION|
        | USSD1_SESSION | EVENT     | session      | USSD-Information / DCD_INFORMATION|
        | USSD2_SESSION | TIME      | session      | USSD-Information / DCD_INFORMATION|
      enum: [VOICE, DATA, SMS, USSD1_EVENT, USSD1_SESSION, USSD2_SESSION]

    ServiceProfile:
      type: string
      description: |
        OCS vendor profile. Selects the AVP code mapping for the
        `serviceType` → `Service-Information` child AVP.

        **3GPP** (vendor-id 10415):
        - VOICE         → IMS-Information (876)
        - DATA          → PS-Information (874)
        - SMS           → SMS-Information (2000)
        - USSD1_EVENT, USSD1_SESSION, USSD2_SESSION → USSD-Information (885)

        **HUAWEI** (Huawei-specific AVPs use vendor-id 2011):
        - VOICE         → IN_INFORMATION (20300)
        - DATA          → PS-Information (874, vendor 10415)
        - SMS           → SMS_INFORMATION (20400)
        - USSD1_EVENT, USSD1_SESSION, USSD2_SESSION → DCD_INFORMATION (2115)
      enum: [3GPP, HUAWEI]
      default: 3GPP

    RequestType:
      type: string
      enum: [INITIAL, UPDATE, TERMINATE, EVENT]

    VarRef:
      type: string
      description: |
        Variable reference. In `avpTree` leaf values the form `{{NAME}}`
        is used; in step configuration and expressions the bare `NAME`
        is used. Both forms resolve to the same variable.
      minLength: 1

    VarValue:
      description: |
        Typed variable value. The engine normalises per the inner AVP's
        Diameter data type at send time; JSON `number` is used for
        Unsigned32/Unsigned64/Integer32 AVPs and for CC-Time.
      oneOf:
        - type: string
        - type: integer
        - type: number
        - type: boolean
        - type: 'null'

    # --- Variables -------------------------------------------------------

    GeneratorStrategy:
      type: string
      description: |
        User-available generator strategies. System-reserved strategies
        (session-id, charging-id, request-number, etc.) are only used for
        implicit system variables; they cannot be assigned to user-authored
        variables.
      enum:
        - literal
        - uuid
        - incrementer
        - random-int
        - random-string
        - random-choice

    GeneratorRefresh:
      type: string
      description: |
        - `once`     — value fixed at execution start.
        - `per-send` — recomputed for every CCR.
      enum: [once, per-send]

    VariableSourceGenerator:
      type: object
      required: [kind, strategy, refresh]
      properties:
        kind:
          type: string
          const: generator
        strategy:
          $ref: '#/components/schemas/GeneratorStrategy'
        refresh:
          $ref: '#/components/schemas/GeneratorRefresh'
        params:
          type: object
          description: |
            Strategy-dependent parameters. Shape varies by `strategy`:
            - `literal`       — `{ value: <VarValue> }`
            - `incrementer`   — `{ start?: number, step?: number }`
            - `random-int`    — `{ min?: number, max?: number }`
            - `random-string` — `{ length: number, charset: "alpha"|"numeric"|"alphanumeric"|"hex" }`
            - `random-choice` — `{ options: string[] }`
            - `uuid`          — no params.
          additionalProperties: true

    VariableSourceBound:
      type: object
      required: [kind, from, field]
      properties:
        kind:
          type: string
          const: bound
        from:
          type: string
          enum: [subscriber, peer, config, step]
        field:
          type: string
          description: |
            Name of the field on the source resource, e.g. `msisdn` /
            `originHost` / `service-context` / `requestType`.

    VariableSourceExtracted:
      type: object
      required: [kind, path]
      properties:
        kind:
          type: string
          const: extracted
        path:
          type: string
          description: |
            Path into the CCA response AVP tree, in dot/bracket notation
            (e.g. `MSCC[100].Granted-Service-Unit.CC-Total-Octets`).
        transform:
          type: string
          description: |
            Optional expression applied to the extracted value before
            assignment (see docs/ARCHITECTURE.md §19).

    VariableSource:
      description: |
        Discriminated union identifying where a variable's value comes from.
      oneOf:
        - $ref: '#/components/schemas/VariableSourceGenerator'
        - $ref: '#/components/schemas/VariableSourceBound'
        - $ref: '#/components/schemas/VariableSourceExtracted'
      discriminator:
        propertyName: kind
        mapping:
          generator: '#/components/schemas/VariableSourceGenerator'
          bound: '#/components/schemas/VariableSourceBound'
          extracted: '#/components/schemas/VariableSourceExtracted'

    Variable:
      type: object
      description: |
        A user-declared variable. System variables (SESSION_ID, MSISDN,
        RG<rg>_GRANTED, etc.) are auto-provisioned at run time and do not
        appear in `scenario.variables`.
      required: [name, source]
      properties:
        name:
          type: string
          description: |
            Unique within the scenario. Convention — `SCREAMING_SNAKE_CASE`.
            In `multi-mscc` mode, per-service variables are prefixed
            `RG<rg>_` (engine-provisioned — not authored here).
          pattern: '^[A-Z][A-Z0-9_]*$'
        source:
          $ref: '#/components/schemas/VariableSource'
        description:
          type: string

    # --- AVP tree --------------------------------------------------------

    AvpNode:
      type: object
      description: |
        One node in the CCR envelope. Either a grouped AVP (has `children`)
        or a leaf AVP (has `valueRef`). The `avpTree` is the CCR *minus*
        the service-unit AVPs — those are modelled separately in
        `scenario.services` and spliced in at send time by the engine
        (see docs/ARCHITECTURE.md §4 and §7).
      required: [name, code]
      properties:
        name:
          type: string
          description: AVP name from the Diameter dictionary (e.g. `Origin-Host`).
        code:
          type: integer
          description: AVP code (e.g. 264 for Origin-Host).
          minimum: 0
        vendorId:
          type: integer
          description: Vendor-Id, omitted for base-protocol AVPs.
          minimum: 0
        children:
          type: array
          description: |
            Grouped AVP body. Present iff this is a grouped AVP.
          items:
            $ref: '#/components/schemas/AvpNode'
        valueRef:
          $ref: '#/components/schemas/VarRef'
        locked:
          type: boolean
          description: |
            When true the Builder prevents deletion of this node and marks
            it with an [engine] badge. Leaf nodes with `locked: true` still
            allow their `valueRef` to be edited; locked grouped nodes are
            read-only (expand/collapse only). Used for system-mandatory AVPs
            (Origin-Host, Session-Id, Service-Information sub-tree, etc.).

    # --- Services --------------------------------------------------------

    Service:
      type: object
      description: |
        One service entry on a scenario. Controls how the engine
        constructs RSU/USU (and MSCC wrapping) at send time. See §4
        for how `serviceModel` picks between root / single-mscc /
        multi-mscc placement.
      required: [id, requestedUnits]
      properties:
        id:
          type: string
          description: |
            Stable key for this service. In `multi-mscc` mode, typically
            the Rating-Group as a decimal string (e.g. `"100"`) since it
            doubles as the catalogue key and feeds `RG<rg>_` variable
            naming.
        ratingGroup:
          $ref: '#/components/schemas/VarRef'
          description: |
            Rating-Group AVP (432). Required for `single-mscc` and
            `multi-mscc`; omitted for `root`.
        serviceIdentifier:
          $ref: '#/components/schemas/VarRef'
          description: |
            Service-Identifier AVP (439). Optional for MSCC-based service
            models; omitted for `root`.
        requestedUnits:
          $ref: '#/components/schemas/VarRef'
          description: |
            Variable carrying the requested-service-units quantity. Engine
            applies the §7 presence rules to decide whether RSU is emitted.
        usedUnits:
          $ref: '#/components/schemas/VarRef'
          description: |
            Variable carrying used-service-units quantity. Engine applies
            the §7 presence rules to decide whether USU is emitted.

    ServiceSelection:
      description: |
        How a step picks which services (`scenario.services` entries) to
        include. Required in `multi-mscc` scenarios; omitted otherwise.
      oneOf:
        - type: object
          required: [mode, serviceIds]
          properties:
            mode:
              type: string
              const: fixed
            serviceIds:
              type: array
              items:
                type: string
              minItems: 1
        - type: object
          required: [mode, from, count]
          properties:
            mode:
              type: string
              const: random
            from:
              type: array
              items:
                type: string
              minItems: 1
            count:
              oneOf:
                - type: integer
                  minimum: 1
                - type: object
                  required: [min, max]
                  properties:
                    min:
                      type: integer
                      minimum: 1
                    max:
                      type: integer
                      minimum: 1
      discriminator:
        propertyName: mode
        mapping:
          fixed: '#/components/schemas/ServiceSelectionFixed'
          random: '#/components/schemas/ServiceSelectionRandom'

    ServiceSelectionFixed:
      type: object
      required: [mode, serviceIds]
      properties:
        mode:
          type: string
          const: fixed
        serviceIds:
          type: array
          items:
            type: string
          minItems: 1

    ServiceSelectionRandom:
      type: object
      required: [mode, from, count]
      properties:
        mode:
          type: string
          const: random
        from:
          type: array
          items:
            type: string
          minItems: 1
        count:
          oneOf:
            - type: integer
              minimum: 1
            - type: object
              required: [min, max]
              properties:
                min:
                  type: integer
                  minimum: 1
                max:
                  type: integer
                  minimum: 1

    # --- Steps -----------------------------------------------------------

    ResultHandler:
      type: object
      description: |
        Declarative reaction to a specific outcome. Evaluated after
        assertions; action drives the scheduler.
      required: [when, action]
      properties:
        when:
          type: string
          description: |
            Expression evaluated against the live context (see §10).
        action:
          type: string
          enum: [continue, stop, retry]

    RequestStep:
      type: object
      required: [kind, requestType]
      properties:
        kind:
          type: string
          const: request
        label:
          type: string
          description: Optional display label shown in the execution history pane.
        requestType:
          $ref: '#/components/schemas/RequestType'
        services:
          $ref: '#/components/schemas/ServiceSelection'
          description: |
            Required in `multi-mscc` scenarios. Omitted in `root` and
            `single-mscc` (the single service is implicit).
        overrides:
          type: object
          description: |
            Per-step transient map of variable-name → value, shadowing
            scenario defaults for this step only. Keys must be declared
            variables.
          additionalProperties:
            $ref: '#/components/schemas/VarValue'
        assertions:
          type: array
          items:
            type: string
          description: |
            Post-receive predicates. On failure the step is marked failed
            and the first matching result handler decides what to do
            next (default: stop).
        guards:
          type: array
          items:
            type: string
          description: Pre-send predicates. On failure the step is skipped.
        resultHandlers:
          type: array
          items:
            $ref: '#/components/schemas/ResultHandler'
        repeat:
          type: integer
          minimum: 1
          description: |
            Fixed iteration count. Mutually exclusive with `repeatUntil`.
            Only meaningful for UPDATE steps.
        repeatUntil:
          type: string
          description: |
            Expression evaluated after each iteration. Loop exits when the
            expression returns true. Mutually exclusive with `repeat`.
            Both `{{VAR}}` and bare `VAR` notation are accepted.
        maxRepeat:
          type: integer
          minimum: 1
          description: |
            Safety cap when `repeatUntil` is set. Loop exits after this many
            iterations even if the condition hasn't fired. Defaults to 100.
        delaySec:
          type: integer
          minimum: 0
          description: |
            Fixed inter-iteration delay in seconds. Applied between
            consecutive iterations of a repeat loop.
        delayJitterSec:
          type: integer
          minimum: 0
          description: |
            Random jitter added to `delaySec`. Actual delay is
            `delaySec + rand(0, delayJitterSec)` seconds.
        useValidityTime:
          type: boolean
          description: |
            When true, the inter-iteration delay is derived from the
            Validity-Time AVP in the last CCA response, scaled by
            `validityScale`. Overrides `delaySec`/`delayJitterSec`.
        validityScale:
          type: number
          description: |
            Multiplier applied to the Validity-Time value when
            `useValidityTime` is true. Defaults to 1.0.

    ScenarioStep:
      description: A scenario step. All steps are request steps.
      $ref: '#/components/schemas/RequestStep'

    # --- Scenario top-level ----------------------------------------------

    ScenarioSummary:
      type: object
      description: Row-level shape for the scenarios list view.
      required: [id, name, sessionMode, serviceModel, origin, stepCount, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        serviceType:
          $ref: '#/components/schemas/ServiceType'
        serviceProfile:
          $ref: '#/components/schemas/ServiceProfile'
        sessionMode:
          $ref: '#/components/schemas/SessionMode'
        serviceModel:
          $ref: '#/components/schemas/ServiceModel'
        origin:
          $ref: '#/components/schemas/ScenarioOrigin'
        favourite:
          type: boolean
        subscriberId:
          type: string
        peerId:
          type: string
        serviceContextId:
          type: string
          description: |
            Overrides the Diameter Service-Context-Id AVP for this scenario.
            Defaults to `32251@3gpp.org` when omitted.
        stepCount:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time

    Scenario:
      description: Full scenario body.
      allOf:
        - $ref: '#/components/schemas/ScenarioSummary'
        - type: object
          required: [avpTree, services, variables, steps]
          properties:
            avpTree:
              type: array
              description: |
                Root-level AVPs of the CCR envelope, minus the service-unit
                AVPs. Structure is frozen at execution start.
              items:
                $ref: '#/components/schemas/AvpNode'
            services:
              type: array
              description: |
                Service entries. Exactly one in `root` / `single-mscc`;
                one or more in `multi-mscc`.
              items:
                $ref: '#/components/schemas/Service'
              minItems: 1
            variables:
              type: array
              description: |
                User-declared variables. System variables are implicit
                and auto-provisioned at run time.
              items:
                $ref: '#/components/schemas/Variable'
            steps:
              type: array
              items:
                $ref: '#/components/schemas/ScenarioStep'

    ScenarioInput:
      type: object
      description: |
        Writable subset of `Scenario`. Used for create (POST /scenarios)
        and replace (PUT /scenarios/{id}). Server-owned fields (`id`,
        `origin`, `updatedAt`, `stepCount`) are ignored on write —
        `origin` is always `user` on create/replace; system starters
        cannot be updated.
      required:
        [name, sessionMode, serviceModel, subscriberId, peerId, avpTree, services, variables, steps]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
        serviceType:
          $ref: '#/components/schemas/ServiceType'
        serviceProfile:
          $ref: '#/components/schemas/ServiceProfile'
        sessionMode:
          $ref: '#/components/schemas/SessionMode'
        serviceModel:
          $ref: '#/components/schemas/ServiceModel'
        favourite:
          type: boolean
          default: false
        subscriberId:
          type: string
        peerId:
          type: string
        serviceContextId:
          type: string
          description: |
            Overrides the Diameter Service-Context-Id AVP. Defaults to
            `32251@3gpp.org` when omitted.
        avpTree:
          type: array
          items:
            $ref: '#/components/schemas/AvpNode'
        services:
          type: array
          items:
            $ref: '#/components/schemas/Service'
          minItems: 1
        variables:
          type: array
          items:
            $ref: '#/components/schemas/Variable'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/ScenarioStep'

    ScenarioDuplicateInput:
      type: object
      description: |
        Optional body for `POST /scenarios/{id}/duplicate`. When omitted,
        the server picks a name by suffixing ` (copy)` to the source.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128

    # ─────────────── Executions ───────────────

    ExecutionMode:
      type: string
      description: |
        Runtime behaviour of an execution — independent of the scenario's
        `sessionMode`.

        - `interactive` — honours pause steps and runtime breakpoints;
                           UI presents a debugger.
        - `continuous`  — ignores pauses and breakpoints; runs through.
                           Required for batched runs (`concurrency > 1`
                           or `repeats > 1`).
      enum: [interactive, continuous]

    ExecutionState:
      type: string
      description: |
        Execution state machine. See docs/ARCHITECTURE.md §6.

        Non-terminal: `pending`, `running`, `paused`.
        Terminal: `success`, `failure`, `aborted`, `error`.
      enum:
        - pending
        - running
        - paused
        - success
        - failure
        - aborted
        - error

    PauseReason:
      type: string
      description: |
        Why an execution entered `paused`:
        - `pause-step` — the scenario contains an explicit `pause` step.
        - `breakpoint` — a runtime breakpoint fired.
        - `user`       — the user clicked Pause (or called /pause).
      enum: [pause-step, breakpoint, user]

    StartExecutionInput:
      type: object
      required: [scenarioId, mode]
      properties:
        scenarioId:
          type: string
        mode:
          $ref: '#/components/schemas/ExecutionMode'
        overrides:
          type: object
          description: Per-run overrides of the scenario's default bindings.
          properties:
            subscriberIds:
              type: array
              description: |
                Subscriber pool. When multiple ids are supplied and
                `repeats > 1`, the engine round-robins across iterations.
              items:
                type: string
              minItems: 1
            peerId:
              type: string
              description: |
                Overrides the scenario's bound peer for this run only.
        concurrency:
          type: integer
          description: |
            Parallel workers. Only legal with `mode: continuous`; values
            other than 1 with `interactive` return 422.
          minimum: 1
          default: 1
        repeats:
          type: integer
          description: |
            Iterations per worker. Only legal with `mode: continuous`.
          minimum: 1
          default: 1

    StartExecutionSimpleResult:
      type: object
      required: [sessionId]
      description: |
        Simplified response for `POST /executions`. Returns the session
        ID that can be used with `/executions/{id}` and
        `/events/executions/{id}`.
      properties:
        sessionId:
          type: string
          description: Opaque identifier for the started execution session.

    ExecutionStatusResult:
      type: object
      required: [sessionId, state, currentStep, metrics]
      description: |
        Current status of an execution session returned by
        `GET /executions/{id}`.
      properties:
        sessionId:
          type: string
        state:
          type: string
          description: |
            Lifecycle state: `active`, `paused`, `completed`,
            `terminated`, or `error`.
        currentStep:
          type: integer
          minimum: 0
          description: 0-based index of the current or last-completed step.
        metrics:
          $ref: '#/components/schemas/ExecutionMetricsResult'

    ExecutionMetricsResult:
      type: object
      required: [totalRequests, successCount, failureCount, minRttMs, maxRttMs, avgRttMs]
      properties:
        totalRequests:
          type: integer
          minimum: 0
        successCount:
          type: integer
          minimum: 0
        failureCount:
          type: integer
          minimum: 0
        minRttMs:
          type: number
          minimum: 0
        maxRttMs:
          type: number
          minimum: 0
        avgRttMs:
          type: number
          minimum: 0

    StepExecutionInput:
      type: object
      description: |
        Optional body for `POST /executions/{id}/step`. Supplies
        per-step variable overrides that shadow the session context for
        this one step only.
      properties:
        overrides:
          type: object
          additionalProperties: true
          description: Variable name → value map for this step only.

    StepExecutionResult:
      type: object
      required: [stepIndex, skipped, resultCode, assertionsPassed, assertions]
      description: |
        Result of a single step execution returned by
        `POST /executions/{id}/step`.
      properties:
        stepIndex:
          type: integer
          minimum: 0
          description: 0-based index of the step that executed.
        skipped:
          type: boolean
          description: True when a guard prevented the CCR from being sent.
        resultCode:
          type: integer
          minimum: 0
          description: |
            Top-level Result-Code from the CCA. Zero when skipped or
            when a transport error occurred.
        assertionsPassed:
          type: boolean
          description: True when all assertions on the step evaluated to true.
        assertions:
          type: array
          items:
            type: object
            required: [expression, passed]
            properties:
              expression:
                type: string
              passed:
                type: boolean
              message:
                type: string
                description: Non-empty when passed is false.

    StartExecutionResult:
      type: object
      required: [items]
      properties:
        batchId:
          type: string
          description: |
            Present when `concurrency * repeats > 1`. Groups the spawned
            executions for the batch view.
        items:
          type: array
          description: One entry per spawned execution.
          items:
            $ref: '#/components/schemas/ExecutionSummary'
          minItems: 1

    ExecutionSummary:
      type: object
      required: [id, scenarioId, scenarioName, mode, state, startedAt]
      properties:
        id:
          type: string
        scenarioId:
          type: string
          description: The scenario this execution was started from.
        scenarioName:
          type: string
          description: Name at execution time (denormalised).
        mode:
          $ref: '#/components/schemas/ExecutionMode'
        peerId:
          type: string
        peerName:
          type: string
        subscriberId:
          type: string
        subscriberMsisdn:
          type: string
        batchId:
          type: string
          description: |
            Present on executions spawned from a batched Run.
        state:
          $ref: '#/components/schemas/ExecutionState'
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
          description: Present only for terminal states.

    ExecutionPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionSummary'
        page:
          $ref: '#/components/schemas/PageMeta'

    StepRecord:
      type: object
      description: |
        One completed (or in-progress) step of an execution. Matches
        `ScenarioStep` by index; carries the wire-level request/response
        and per-step timing.
      required: [n, kind, state]
      properties:
        n:
          type: integer
          description: 1-based step index.
          minimum: 1
        kind:
          type: string
          enum: [request, consume, wait, pause]
        requestType:
          $ref: '#/components/schemas/RequestType'
          description: Present for `request` steps.
        label:
          type: string
          description: 'Short human label (e.g. `CCR-I`, `pause top-up`).'
        state:
          type: string
          description: |
            - `pending` — not yet started.
            - `running` — this step is currently executing (includes a
                          paused debugger sitting on it).
            - `success` — completed without assertion or engine failure.
            - `failure` — completed with an assertion failure.
            - `error`   — engine fault (transport loss, dictionary miss).
            - `skipped` — guard returned false.
          enum: [pending, running, success, failure, error, skipped]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        durationMs:
          type: integer
          minimum: 0
        errorDetail:
          type: string
        request:
          type: object
          description: |
            Wire-level CCR snapshot after variable resolution. Present
            for `request` steps and for each round of `consume` steps.
          additionalProperties: true
        requestText:
          type: string
          description: |
            Pre-formatted Diameter wire text of the CCR (human-readable,
            one AVP per line). Use this for display; use `request` for
            structured access.
        response:
          type: object
          description: Wire-level CCA snapshot (structured).
          additionalProperties: true
        responseText:
          type: string
          description: |
            Pre-formatted Diameter wire text of the CCA (human-readable,
            one AVP per line). Use this for display; use `response` for
            structured access (result codes, extractions).
        assertionResults:
          type: array
          items:
            type: object
            required: [expression, passed]
            properties:
              expression:
                type: string
              passed:
                type: boolean
              message:
                type: string

    Execution:
      description: |
        Full execution detail. Extends `ExecutionSummary` with the live
        context snapshot and step-by-step history. This is the payload
        returned by `GET /executions/{id}` and carried by every SSE
        `execution.progress` event.
      allOf:
        - $ref: '#/components/schemas/ExecutionSummary'
        - type: object
          required: [currentStep, totalSteps, steps, context]
          properties:
            currentStep:
              type: integer
              description: |
                0-based index of the step currently executing (or
                paused on), or equal to `totalSteps` when terminal.
              minimum: 0
            totalSteps:
              type: integer
              minimum: 0
            pauseReason:
              $ref: '#/components/schemas/PauseReason'
              description: Present when `state == paused`.
            breakpoints:
              type: array
              items:
                type: integer
                minimum: 0
              description: Runtime breakpoints set on this execution.
            steps:
              type: array
              description: |
                All steps completed or in progress so far. Grows over
                time for running executions; full scenario for terminal.
              items:
                $ref: '#/components/schemas/StepRecord'
            context:
              $ref: '#/components/schemas/ExecutionContextSnapshot'

    ExecutionContextSnapshot:
      type: object
      description: |
        Point-in-time snapshot of the live variables map, partitioned by
        scope for UI convenience. Each map is keyed by variable name.
      required: [system, user, extracted]
      properties:
        system:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/VarValue'
          description: |
            System variables (SESSION_ID, MSISDN, CC_REQUEST_NUMBER, …).
        user:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/VarValue'
          description: User-declared variables.
        extracted:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/VarValue'
          description: |
            Variables whose source is `extracted`, including the auto-
            provisioned per-RG state variables (`RG<rg>_GRANTED`,
            `RG<rg>_STATE`, …).

    # --- Override inputs -------------------------------------------------

    ContextOverrideInput:
      type: object
      description: |
        Variable-name → value map, applied permanently to the live context.
        Rejected with 422 for engine-reserved system variables.
      required: [variables]
      properties:
        variables:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/VarValue'
          minProperties: 1

    PayloadOverrideInput:
      type: object
      description: |
        Variable-name → value map, applied to the next send only. Repeated
        calls overwrite the pending payload override.
      required: [variables]
      properties:
        variables:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/VarValue'
          minProperties: 1

    BreakpointSet:
      type: object
      required: [stepIndices]
      properties:
        stepIndices:
          type: array
          description: 0-based step indices at which to pause.
          items:
            type: integer
            minimum: 0
          uniqueItems: true

    # --- SSE event payloads ----------------------------------------------

    ExecutionPaused:
      type: object
      required: [executionId, atStepIndex, reason, at]
      properties:
        executionId:
          type: string
        atStepIndex:
          type: integer
          minimum: 0
        reason:
          $ref: '#/components/schemas/PauseReason'
        at:
          type: string
          format: date-time

    ExecutionResumed:
      type: object
      required: [executionId, fromStepIndex, at]
      properties:
        executionId:
          type: string
        fromStepIndex:
          type: integer
          minimum: 0
        at:
          type: string
          format: date-time

    SseEventPayload:
      description: |
        Union of every JSON payload carried in the `data:` field of an SSE
        record emitted by `GET /events`. The `event:` field disambiguates;
        see the table on `/events` for the mapping.
      oneOf:
        - $ref: '#/components/schemas/Peer'
        - $ref: '#/components/schemas/DashboardKpis'
        - $ref: '#/components/schemas/ExecutionSummary'
        - $ref: '#/components/schemas/Execution'
        - $ref: '#/components/schemas/ExecutionPaused'
        - $ref: '#/components/schemas/ExecutionResumed'

    # ─────────────── Metrics ───────────────

    ResponseTimePoint:
      type: object
      required: [t, p50, p95, p99]
      properties:
        t:
          type: string
          format: date-time
        p50:
          type: number
          minimum: 0
        p95:
          type: number
          minimum: 0
        p99:
          type: number
          minimum: 0

    ResponseTimeSeries:
      type: object
      required: [window, points]
      properties:
        window:
          type: string
          examples: [PT1H]
        bucketSize:
          type: string
          examples: [PT2M]
        points:
          type: array
          items:
            $ref: '#/components/schemas/ResponseTimePoint'

    AIConfig:
      type: object
      required: [endpoint, model, apiKeySet]
      description: Current AI assistant configuration (read-only view; API key never exposed).
      properties:
        endpoint:
          type: string
          description: LLM API base URL (e.g. https://api.openai.com)
          examples: ['https://api.openai.com', 'http://localhost:1234']
        model:
          type: string
          description: Model identifier to use for completions
          examples: ['gpt-4o', 'llama3']
        apiKeySet:
          type: boolean
          description: True when an API key is configured; the key value is never returned.

    AIConfigInput:
      type: object
      description: Input body for PATCH /config/ai.
      properties:
        endpoint:
          type: string
          description: LLM API base URL. Must be non-empty.
        model:
          type: string
          description: Model identifier to use for completions.
        apiKey:
          type: string
          description: |
            API key for the LLM endpoint. Leave blank to keep the existing key.
            Send a new value to replace it.
